name: Run Bot on GitHub

on:
  push:
    branches:
      - main  # أو الفرع الذي تريد أن تعمل عليه

jobs:
  build:
    runs-on: ubuntu-latest  # استخدم نظام التشغيل الذي ترغب في تشغيل البوت عليه

    steps:
      # 1. Checkout الكود
      - name: Checkout repository
        uses: actions/checkout@v2

      # 2. إعداد Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # تأكد من أنك تستخدم نفس الإصدار الذي تحتاجه

      # 3. تثبيت الحزم
      - name: Install dependencies
        run: npm install  # أو yarn install إذا كنت تستخدم Yarn

      # 4. تشغيل البوت
      - name: Run Bot
        run: node bot.js  # هنا يشير إلى اسم ملف البوت
